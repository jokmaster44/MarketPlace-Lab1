services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cosmocats
      POSTGRES_USER: cosmocats
      POSTGRES_PASSWORD: cosmocats
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmocats -d cosmocats"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
